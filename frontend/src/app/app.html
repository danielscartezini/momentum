<main style="max-width: 600px; margin: 2rem auto; font-family: sans-serif;">
  <h1>Meu Trackeador de Hábitos</h1>

  <!-- Formulário conectado ao seu objeto 'habit' -->
  <div style="display: flex; gap: 8px; margin-bottom: 1.5rem;">
    <input [(ngModel)]="habit.habitName" placeholder="Nome do hábito" />
    <input [(ngModel)]="habit.habitDescription" placeholder="Descrição" />
    <button (click)="addHabit(habit)">Adicionar</button>
  </div>

  <!-- Lista conectada ao seu array 'habits' -->
  @for (item of habits; track item.id) {
    <div style="border: 1px solid #ccc; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <strong>{{ item.habitName }}</strong>
        <p style="margin: 4px 0;">{{ item.habitDescription }}</p>
      </div>
      <button (click)="deleteHabit(item)">Excluir</button>
    </div>
  } @empty {
    <p>Nenhum hábito cadastrado ainda.</p>
  }
</main>
