// 1. Libera o CORS no Quarkus
// Desbloqueia o acesso da aplicação Angular (porta 4200) à API do Quarkus (porta 8080)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

// O Quarkus vai criar uma tabela Habit no banco de dados H2 com base na classe Habit.java
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:habitsdb
quarkus.hibernate-orm.database.generation=drop-and-create